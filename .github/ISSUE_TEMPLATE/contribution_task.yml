name: Contribution task
description: A scoped task open for community contributors
title: "[Task] "
labels: ["help wanted"]
body:
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options:
        - Trivial
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: The problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What must be built or changed.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely affected
      placeholder: |
        - src/stellar/budget.js
        - test/stellar-budget.test.js
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Testing and verification
      placeholder: |
        - [ ] npm run check
        - [ ] npm test
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Constraints and notes
      description: Security considerations, edge cases, or references.